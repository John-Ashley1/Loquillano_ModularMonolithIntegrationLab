spring.profiles.active=local

# Supabase (Postgres) connection - never hardcode real values here.
# Set these as environment variables before running the app:
#   SUPABASE_DB_URL, SUPABASE_DB_USERNAME, SUPABASE_DB_PASSWORD
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables are created via sql/create_tables.sql, so Hibernate should only
# validate that entities match the schema, never auto-generate/alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# React (Vite) dev server origin allowed by CORS
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Products with stock below this number trigger a LowStock event after a reserve()
app.inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}

server.port=8080