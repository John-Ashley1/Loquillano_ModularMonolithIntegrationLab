app.cors.allowed-origin=http://localhost:5173
app.inventory.low-stock-threshold=5
app.inventory.reorder-quantity=20

app.supplier.legacysupply.base-url=https://legacysupply.onrender.com/api/v1
app.supplier.legacysupply.client-id=23-5192-482
app.supplier.legacysupply.api-key=${LEGACYSUPPLY_API_KEY}

app.supplier.resend-interval-ms=30000
app.supplier.tracking-interval-ms=60000

app.supplier.catalog.P100.sku=RUH-3650
app.supplier.catalog.P100.pack-size=12
app.supplier.catalog.P200.sku=RUH-9809
app.supplier.catalog.P200.pack-size=10
app.supplier.catalog.P300.sku=RUH-8535
app.supplier.catalog.P300.pack-size=12

server.port=8080

# --- Lab 4: Tiangge channel ---
# The API key is read from an environment variable, never committed (Rule 4).
app.channel.tiangge.base-url=https://legacysupply.onrender.com/tiangge/v1
app.channel.tiangge.client-id=${app.supplier.legacysupply.client-id}
app.channel.tiangge.api-key=${LEGACYSUPPLY_API_KEY}
app.channel.app-name=loquillano-shop
app.channel.poll-interval-ms=3000

# Several scheduler threads, so a slow job can never delay the 30s heartbeat.
spring.task.scheduling.pool.size=8
app.order.backorder-timeout-minutes=15
app.order.backorder-sweep-ms=30000
